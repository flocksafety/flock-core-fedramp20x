name: Promote to Public Repo

on:
  push:
    branches:
      - public-release
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          ref: public-release
          persist-credentials: false
      
      - uses: flocksafety/flock-gha-token-dispenser/dispense-token@develop
        id: installtoken
        with:
          repo: flocksafety/flock-core-fedramp20x
          permissions: |
            contents: write

      - name: Push to public repository
        run: |
          ENCODED_AUTH=$(echo -n "${GITHUB_ACTOR}:${{ steps.installtoken.outputs.token }}" | base64)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${ENCODED_AUTH}"
          git remote add public-mirror https://github.com/flocksafety/flock-core-fedramp20x.git
          git push public-mirror public-release:master
